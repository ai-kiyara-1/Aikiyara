<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aikiyara | AI Focus Planner</title>
    <meta name="description" content="Aikiyara is a sleek productivity planner with notes, focus timer, and smart task management." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-icon">A</div>
          <div>
            <p class="eyebrow">AI productivity</p>
            <h1>Aikiyara</h1>
          </div>
        </div>

        <div class="panel">
          <p class="panel-title">Quick actions</p>
          <button class="quick-action" data-task="Plan my top 3 priorities for today">Top 3 priorities</button>
          <button class="quick-action" data-task="Review the blockers in my current project">Review blockers</button>
          <button class="quick-action" data-task="Plan a 30 minute learning sprint">Learning sprint</button>
          <button class="quick-action" data-task="Draft a clear follow-up message to my team">Follow-up note</button>
        </div>

        <div class="panel stats-panel">
          <p class="panel-title">Day summary</p>
          <div class="stat-row">
            <span>Tasks</span>
            <strong id="totalTasks">0</strong>
          </div>
          <div class="stat-row">
            <span>Done</span>
            <strong id="doneTasks">0</strong>
          </div>
          <div class="stat-row">
            <span>Focus</span>
            <strong id="focusScore">0%</strong>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Welcome back</p>
            <h2 id="greeting">Let’s get productive</h2>
          </div>
          <div class="topbar-actions">
            <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
            <button id="clearAllBtn" class="secondary-btn">Clear all</button>
          </div>
        </header>

        <section class="hero-grid">
          <div class="card focus-card">
            <div class="card-head">
              <h3>Focus session</h3>
              <span class="badge success">25 min</span>
            </div>
            <div class="timer" id="timerDisplay">25:00</div>
            <div class="timer-actions">
              <button id="startTimerBtn" class="primary-btn">Start</button>
              <button id="resetTimerBtn" class="secondary-btn small">Reset</button>
            </div>
          </div>

          <div class="card insight-card">
            <div class="card-head">
              <h3>AI insight</h3>
              <span class="badge">Today</span>
            </div>
            <p id="insightText">Start with one high-impact task and finish it before anything else.</p>
          </div>
        </section>

        <section class="task-box">
          <form id="taskForm" autocomplete="off">
            <input id="taskInput" type="text" placeholder="Add a task, idea, or goal..." maxlength="140" required />
            <button type="submit" class="primary-btn">Add task</button>
          </form>
        </section>

        <section class="content-grid">
          <div class="card">
            <div class="card-head">
              <h3>Task board</h3>
              <span id="taskCountBadge" class="badge">0 tasks</span>
            </div>
            <ul id="taskList" class="task-list"></ul>
          </div>

          <div class="card note-card">
            <div class="card-head">
              <h3>Quick notes</h3>
              <span class="badge subtle">Saved locally</span>
            </div>
            <textarea id="notesInput" placeholder="Write ideas, reminders, or next steps..."></textarea>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
